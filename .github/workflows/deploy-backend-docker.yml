name: Build & Publish Backend Container (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - 'cyber/apps/**'
      - 'cyber/crimecast/**'
      - 'cyber/requirements.txt'
      - 'cyber/Dockerfile*'
      - '.github/workflows/deploy-backend-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cyber/requirements.txt

      - name: Install dependencies
        working-directory: cyber
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks
        working-directory: cyber
        run: |
          python manage.py check --settings=crimecast.settings.base

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cyber
          file: ./cyber/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
