version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/static
      - media_files:/media
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 cybersandbox.asgi:application"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersandbox_prod}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrimeCast2026Pass}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber_admin:CrimeCast2026Pass@postgres:5432/cybersandbox_prod}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cybersandbox.settings.production}
      SECRET_KEY: ${SECRET_KEY:-crimecast-production-secret-key-2026}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: celery -A cybersandbox worker -l info
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersandbox_prod}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrimeCast2026Pass}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber_admin:CrimeCast2026Pass@postgres:5432/cybersandbox_prod}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cybersandbox.settings.production}
      SECRET_KEY: ${SECRET_KEY:-crimecast-production-secret-key-2026}
    volumes:
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: celery -A cybersandbox beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersandbox_prod}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrimeCast2026Pass}
      DATABASE_URL: ${DATABASE_URL:-postgres://cyber_admin:CrimeCast2026Pass@postgres:5432/cybersandbox_prod}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cybersandbox.settings.production}
      SECRET_KEY: ${SECRET_KEY:-crimecast-production-secret-key-2026}
    volumes:
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersandbox_prod}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CrimeCast2026Pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber_admin} -d ${POSTGRES_DB:-cybersandbox_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
